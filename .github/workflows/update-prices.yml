name: Update Gold Prices

on:
  schedule:
    # Türkiye DST uygulamıyor (yıl boyu UTC+3): 08:05/11:05/14:05 UTC ≈ 11:00/14:00/17:00 TR.
    # Tam saat başı değil, GitHub'ın kendi dokümantasyonu tam saat başlarında
    # yoğunluktan gecikme/atlama olabileceğini söylüyor, 5 dk kaydırdık.
    - cron: '5 8,11,14 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Backend'den güncel fiyatları çek
        run: |
          curl -sf "https://altin-takip-z0pz.onrender.com/api/all" \
            -o snapshot.json \
            --max-time 180 --retry 3 --retry-delay 15 --retry-all-errors

      - name: history.json'a ekle
        run: node scripts/append-history.js snapshot.json

      - name: Commit ve push
        run: |
          git config user.name "gold-price-bot"
          git config user.email "actions@github.com"
          git add data/history.json
          git diff --cached --quiet || git commit -m "Fiyat güncellemesi $(date -u +%Y-%m-%dT%H:%M)Z"
          git push
